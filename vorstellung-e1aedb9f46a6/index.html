<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Syncopa Vorstellung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Konzept: eine Konzertbühne (16:9) – Screenshots stehen wie Solisten im Scheinwerferlicht, das Kapitel-Menü ist das Konzertprogramm. */
:root {
  --nacht: #0c1524;        /* Bühnenhintergrund */
  --buehne: #14233a;       /* Flächen auf der Bühne */
  --linie: rgba(214, 226, 245, 0.14);
  --text: #eef2f8;
  --text2: #a5b4ca;
  --messing: #e2ab4b;      /* Messing, Akzent */
  --messing-hell: #f3cf86;
  --blau: #4f7fb8;         /* Syncopa-Blau */
  --orange: #f0852a;       /* Syncopa-Logo */
  --gruen: #5fb38a;
  --rot: #e07a6b;
  --schrift-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --schrift: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--nacht); color: var(--text); }
body { font-family: var(--schrift); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.seite { max-width: 1280px; margin: 0 auto; display: grid; gap: 12px; }

/* ---------- Bühne ---------- */
.rahmen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--nacht); box-shadow: 0 0 0 1px var(--linie), 0 30px 80px rgba(0,0,0,.5); }
.buehne { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(1100px 640px at 72% 38%, #1b3150 0%, transparent 70%), radial-gradient(700px 500px at 10% 90%, #1a2a43 0%, transparent 70%), var(--nacht); }
.buehne::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(1600px 900px at 50% 50%, transparent 60%, rgba(0,0,0,.45)); }
.szene { position: absolute; inset: 0; visibility: hidden; }
.szene.aktiv { visibility: visible; }

/* Einblenden: Elemente mit .ein erscheinen nacheinander (--d = Verzögerung) */
.aktiv .ein { animation: ein .9s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both; }
.aktiv .ein-links { animation: einLinks .9s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both; }
.aktiv .ein-gross { animation: einGross 1.1s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both; }
@keyframes ein { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes einLinks { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
@keyframes einGross { from { opacity: 0; transform: scale(.94) translateY(30px); } to { opacity: 1; transform: none; } }

/* Kopf- und Fußzeile auf der Bühne (Konzertprogramm) */
.programmzeile { position: absolute; left: 80px; right: 80px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: var(--text2); letter-spacing: .04em; z-index: 5; }
.programmzeile b { color: var(--messing); font-weight: 600; font-variant-numeric: tabular-nums; }
.programmzeile .marke { display: flex; align-items: center; gap: 10px; font-family: var(--schrift-display); font-weight: 700; color: var(--text); letter-spacing: .08em; text-transform: uppercase; font-size: 15px; }
.programmzeile .marke img { height: 26px; }

/* Text-Spalte */
.spalte { position: absolute; left: 80px; top: 110px; width: 500px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 18px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--messing); display: flex; align-items: center; gap: 14px; }
.eyebrow::before { content: ""; width: 34px; height: 2px; background: var(--messing); }
h2 { font-family: var(--schrift-display); font-weight: 800; font-size: 60px; line-height: 1.02; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.punkte { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.punkte li { font-size: 24px; line-height: 1.32; color: #d9e2ef; padding-left: 34px; position: relative; }
.punkte li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--messing); box-shadow: 0 0 0 5px rgba(226,171,75,.18); }
.punkte li b { color: var(--text); font-weight: 700; }
.leise { font-size: 19px; color: var(--text2); line-height: 1.45; }

/* Browserfenster mit Kamera */
.fenster { position: absolute; left: 640px; top: 104px; width: 880px; border-radius: 14px; overflow: hidden; background: #0f1a2b;
  box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 40px 90px rgba(0,0,0,.55), 0 0 120px rgba(79,127,184,.18); }
.fenster.breit { left: 120px; width: 1360px; top: 96px; }
.fenster .leiste { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1c2a40; border-bottom: 1px solid rgba(255,255,255,.06); }
.fenster .leiste i { width: 11px; height: 11px; border-radius: 50%; background: #3a4a63; }
.fenster .leiste i:nth-child(1) { background: #e0675a; } .fenster .leiste i:nth-child(2) { background: #e4b14a; } .fenster .leiste i:nth-child(3) { background: #5fb38a; }
.fenster .adresse { margin-left: 14px; flex: 1; height: 22px; border-radius: 6px; background: #111c2e; color: #8ea0ba; font-size: 13px; display: flex; align-items: center; padding: 0 12px; letter-spacing: .02em; }
.ansicht { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #f3f5f8; }
.kamera { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 1.6s cubic-bezier(.45,.05,.25,1); --s: 1; }
.kamera img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; transition: opacity .7s ease; }
.kamera img.weg { opacity: 0; }
.markierung { position: absolute; border-radius: calc(10px / var(--s)); box-shadow: 0 0 0 calc(3px / var(--s)) var(--messing), 0 0 0 calc(9px / var(--s)) rgba(226,171,75,.25), 0 0 0 9999px rgba(8,14,26,.38);
  opacity: 0; transition: opacity .6s ease, left 1.2s ease, top 1.2s ease, width 1.2s ease, height 1.2s ease; pointer-events: none; }
.markierung.an { opacity: 1; }
.hinweis { position: absolute; z-index: 3; max-width: 340px; background: var(--messing); color: #1d1406; font-weight: 700; font-size: 19px; line-height: 1.28; padding: 12px 16px; border-radius: 10px;
  box-shadow: 0 14px 30px rgba(0,0,0,.4); opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; pointer-events: none; }
.hinweis.an { opacity: 1; transform: none; }

/* Handy */
.handy { position: absolute; width: 250px; aspect-ratio: 390 / 844; border-radius: 34px; padding: 10px; background: #0a0f18; box-shadow: 0 0 0 2px #2b3950, 0 30px 70px rgba(0,0,0,.6); }
.handy img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 26px; display: block; }
.handy::before { content: ""; position: absolute; top: 16px; left: 50%; width: 70px; height: 18px; margin-left: -35px; border-radius: 10px; background: #0a0f18; z-index: 2; }

/* Titel */
.titel { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.titel .innen { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.titel img { width: 300px; }
.titel h1 { font-family: var(--schrift-display); font-weight: 800; font-size: 50px; letter-spacing: -.01em; margin: 0; line-height: 1.1; text-wrap: balance; max-width: 1100px; }
.titel .zeile { font-size: 24px; color: var(--text2); max-width: 980px; line-height: 1.45; }
.titel .widmung { font-size: 17px; letter-spacing: .18em; text-transform: uppercase; color: var(--messing); }
.notenlinien { position: absolute; left: 0; right: 0; top: 50%; height: 120px; margin-top: -60px; opacity: .1; background: repeating-linear-gradient(to bottom, var(--text) 0 2px, transparent 2px 28px); pointer-events: none; }
.abspielen { margin-top: 10px; display: inline-flex; align-items: center; gap: 14px; font: 700 24px var(--schrift); color: #1d1406; background: var(--messing); border: 0; border-radius: 999px; padding: 18px 34px; cursor: pointer; box-shadow: 0 16px 40px rgba(226,171,75,.3); }
.abspielen:hover { background: var(--messing-hell); }
.abspielen:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }

/* Ausgangslage: verstreute Zettel */
.zettel { position: absolute; transition: left 1.3s cubic-bezier(.6,0,.2,1), top 1.3s cubic-bezier(.6,0,.2,1), opacity 1s ease .5s, scale 1.3s ease, rotate 1.3s ease; }
.zettel > div { padding: 16px 22px; border-radius: 10px; font-size: 22px; font-weight: 600; background: #20314d; color: #d7e1ef; box-shadow: 0 16px 34px rgba(0,0,0,.35); display: flex; gap: 12px; align-items: center; white-space: nowrap; }
.zettel svg { width: 28px; height: 28px; stroke: var(--messing); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sammeln .zettel { left: 720px !important; top: 410px !important; opacity: 0; scale: .4; rotate: 0deg !important; }
/* Ruhezustand beim Öffnen: Titel sofort sichtbar */
.ruhe .ein, .ruhe .ein-links, .ruhe .ein-gross { animation: none !important; }
.mitte-karte { position: absolute; left: 520px; top: 300px; width: 560px; padding: 34px; border-radius: 22px; text-align: center; background: linear-gradient(160deg, #1f3657, #162741);
  box-shadow: 0 0 0 1px rgba(226,171,75,.4), 0 30px 80px rgba(0,0,0,.5); opacity: 0; transform: scale(.85); transition: opacity .8s ease 1s, transform .9s cubic-bezier(.2,.7,.2,1) 1s; }
.sammeln .mitte-karte { opacity: 1; transform: none; }
.mitte-karte img { width: 150px; }
.mitte-karte p { font-size: 26px; line-height: 1.4; margin: 14px 0 0; }

/* Modul-Raster */
.raster { position: absolute; left: 80px; right: 80px; top: 250px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 18px; }
.kachel { background: rgba(28, 44, 70, .85); border: 1px solid var(--linie); border-radius: 16px; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 160px; }
.kachel svg { width: 38px; height: 38px; stroke: var(--messing); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.kachel b { font-size: 21px; font-weight: 700; }
.kachel small { font-size: 15.5px; color: var(--text2); line-height: 1.35; }
.kopf-mitte { position: absolute; left: 80px; right: 80px; top: 96px; display: flex; flex-direction: column; gap: 14px; }
.kopf-mitte h2 { font-size: 56px; }

/* BMV-Schaubild */
.knoten { position: absolute; width: 300px; padding: 26px; border-radius: 20px; background: #1b2c47; border: 1px solid var(--linie); box-shadow: 0 30px 60px rgba(0,0,0,.4); }
.knoten b { font-family: var(--schrift-display); font-size: 32px; display: block; }
.knoten small { font-size: 17px; color: var(--text2); line-height: 1.4; display: block; margin-top: 8px; }
.knoten.syncopa { border-color: rgba(226,171,75,.5); }
.spur { position: absolute; height: 2px; background: linear-gradient(90deg, rgba(165,180,202,.15), rgba(226,171,75,.55)); }
.spur span { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; color: #cfd9e8; white-space: nowrap; }
.spur i { position: absolute; top: -5px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--messing); box-shadow: 0 0 14px var(--messing); }
.aktiv .spur i { animation: fliessen 2.6s linear var(--d, 0s) infinite both; }
@keyframes fliessen { from { left: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { left: calc(100% - 12px); opacity: 0; } }
.vorschau-karte { position: absolute; left: 660px; top: 600px; width: 520px; padding: 18px 22px; border-radius: 14px; background: #f3f5f8; color: #1e2a3a; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.vorschau-karte b { font-size: 18px; }
.chips { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.chip { font-size: 16px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.chip.neu { background: #d9f2e4; color: #1d6b43; } .chip.ge { background: #fdeccb; color: #8a5a0b; } .chip.un { background: #e3e9f2; color: #3c4d66; } .chip.ok { background: #4471a3; color: #fff; }

/* Live-Probe */
.tablet { position: absolute; border-radius: 22px; padding: 14px; background: #0a0f18; box-shadow: 0 0 0 2px #2b3950, 0 30px 60px rgba(0,0,0,.5); }
.tablet .blatt { background: #fbfaf6; border-radius: 10px; height: 100%; padding: 14px 16px; color: #222; display: flex; flex-direction: column; gap: 8px; }
.tablet .stimme { font-weight: 700; font-size: 15px; color: #1e2a3a; display: flex; justify-content: space-between; gap: 8px; }
.tablet .stimme em { font-style: normal; color: #b0710e; }
.tablet svg { width: 100%; flex: 1; }
.funk { position: absolute; border: 2px solid var(--messing); border-radius: 50%; opacity: 0; }
.aktiv .funk { animation: funk 2.4s ease-out var(--d, 0s) infinite; }
@keyframes funk { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }

/* Karten (Technik) */
.karten { position: absolute; left: 80px; right: 80px; top: 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.karte { background: rgba(28, 44, 70, .85); border: 1px solid var(--linie); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 10px; }
.karte b { font-size: 25px; } .karte small { font-size: 19px; color: var(--text2); line-height: 1.4; }

/* Schluss */
.kontakt { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
.kontakt div { padding: 16px 24px; border-radius: 14px; background: rgba(28, 44, 70, .85); border: 1px solid var(--linie); text-align: left; }
.kontakt small { display: block; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--messing); margin-bottom: 4px; }
.kontakt span { font-size: 23px; font-weight: 600; user-select: all; }

/* ---------- Bedienleiste ---------- */
.fortschritt { display: flex; gap: 3px; height: 10px; }
.fortschritt button { flex: var(--w) 1 0; min-width: 0; height: 100%; border: 0; padding: 0; border-radius: 3px; background: rgba(165, 180, 202, .2); cursor: pointer; position: relative; overflow: hidden; }
.fortschritt button span { position: absolute; inset: 0; width: var(--f, 0%); background: var(--messing); }
.fortschritt button:hover { background: rgba(165, 180, 202, .35); }
.fortschritt button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.leiste-unten { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; min-width: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--linie);
  background: #17263e; color: var(--text); font: 600 15px var(--schrift); cursor: pointer; }
.knopf:hover { border-color: rgba(226,171,75,.6); }
.knopf:focus-visible, select:focus-visible { outline: 2px solid var(--messing); outline-offset: 2px; }
.knopf.haupt { background: var(--messing); color: #1d1406; border-color: transparent; min-width: 54px; }
.knopf svg { width: 18px; height: 18px; fill: currentColor; }
.zeit { font-variant-numeric: tabular-nums; color: var(--text2); font-size: 15px; }
.kapitel-name { font-weight: 600; font-size: 16px; flex: 1; min-width: 160px; }
.kapitel-name b { color: var(--messing); font-variant-numeric: tabular-nums; margin-right: 8px; }
select { height: 42px; border-radius: 10px; border: 1px solid var(--linie); background: #17263e; color: var(--text); font: 600 15px var(--schrift); padding: 0 10px; }
.programm { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; padding: 16px 18px; border-radius: 14px; background: #111d31; border: 1px solid var(--linie); }
.programm h3 { grid-column: 1 / -1; margin: 0 0 6px; font: 700 15px var(--schrift); letter-spacing: .16em; text-transform: uppercase; color: var(--messing); }
.programm button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 6px 4px; border-radius: 6px; font-size: 15px; color: #cfd9e8; }
.programm button b { color: var(--messing); font-variant-numeric: tabular-nums; min-width: 22px; }
.programm button em { font-style: normal; color: var(--text2); margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; }
.programm button:hover, .programm button.jetzt { color: var(--text); background: rgba(226,171,75,.1); }
.programm button:focus-visible { outline: 2px solid var(--messing); }
.hinweis-text { font-size: 13px; color: var(--text2); }

/* Aufnahme-Modus (für das Video): nur die Bühne */
html.aufnahme body { padding: 0; }
html.aufnahme .seite { max-width: none; gap: 0; }
html.aufnahme .rahmen { border-radius: 0; box-shadow: none; }
html.aufnahme .steuerung, html.aufnahme .programm, html.aufnahme .abspielen, html.aufnahme .hinweis-text { display: none; }

@media (prefers-reduced-motion: reduce) {
  .aktiv .ein, .aktiv .ein-links, .aktiv .ein-gross { animation: none; }
  .kamera, .zettel, .mitte-karte, .markierung { transition: none; }
  .aktiv .spur i, .aktiv .funk { animation: none; }
}
@media (max-width: 640px) { .kapitel-name { order: -1; flex-basis: 100%; } }
</style>

</head>
<body>
<div class="seite">
  <div class="rahmen" id="rahmen"><div class="buehne" id="buehne"></div></div>
  <div class="steuerung" style="display:grid;gap:10px">
    <div class="fortschritt" id="fortschritt" aria-label="Kapitel"></div>
    <div class="leiste-unten">
      <button class="knopf" id="zurueck" title="Voriges Kapitel (←)" aria-label="Voriges Kapitel"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="knopf haupt" id="spielen" title="Abspielen / Pause (Leertaste)" aria-label="Abspielen"><svg viewBox="0 0 24 24" id="spielSymbol"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="knopf" id="weiter" title="Nächstes Kapitel (→)" aria-label="Nächstes Kapitel"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <span class="zeit" id="zeit">0:00 / 0:00</span>
      <span class="kapitel-name" id="kapitelName"></span>
      <label class="zeit" for="tempo">Tempo</label>
      <select id="tempo">
        <option value="0.75">Andante (langsam)</option>
        <option value="1" selected>Moderato (normal)</option>
        <option value="1.4">Allegro (schnell)</option>
      </select>
      <button class="knopf" id="vollbild" title="Vollbild (F)"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>Vollbild</button>
    </div>
  </div>
  <nav class="programm" id="programm" aria-label="Programm"><h3>Programm</h3></nav>
  <p class="hinweis-text">Alle Bildschirmfotos zeigen die echte Syncopa-Oberfläche mit einem erfundenen Beispielverein („Musikverein Musterdorf“). Namen und Kontaktdaten sind frei erfunden. <a id="videoLink" href="Syncopa-Vorstellung.webm" download hidden style="color:var(--messing)">Video herunterladen (WebM)</a></p>
</div>

        ['Rollen statt Passwörter teilen', 'Jede Person meldet sich selbst an und bekommt die Rechte ihrer Funktion.'], ['Updates per Knopfdruck', 'Neue Versionen spielt der Administrator direkt in Syncopa ein.'],
        ['Verschlüsselte Postfach-Zugänge', 'Passwörter der E-Mail-Postfächer werden verschlüsselt gespeichert.'], ['BMV nur lesend', 'Syncopa ändert nichts im BMV, solange der Verein es nicht ausdrücklich will.']];
      return `<div class="kopf-mitte"><div class="eyebrow ein-links" style="--d:.1s">Technik & Datenschutz</div><h2 class="ein" style="--d:.2s">Einfach betrieben, sorgsam mit Daten</h2></div>
        <div class="karten" style="top:260px">${k.map(([t, s], i) => `<div class="karte ein" style="--d:${0.6 + i * 0.3}s"><b>${t}</b><small>${s}</small></div>`).join('')}</div>`; } },

    { id: 'schluss', name: 'Ausklang', dauer: 10000, html: () => `
      <div class="notenlinien"></div>
      <div class="titel"><div class="innen">
        <img class="ein-gross" style="--d:.1s;width:240px" src="img/logo.png" alt="Syncopa">
        <h1 class="ein" style="--d:.5s;font-size:64px">Weniger Verwaltung. Mehr Zeit für die Musik.</h1>
        <div class="kontakt ein" style="--d:1.2s">
          <div><small>Demo ansehen</small><span>syncopa.dannerbam.eu</span></div>
          <div><small>Quellcode</small><span>github.com/Hanner72/syncopa</span></div>
          <div><small>Entwickelt von</small><span>Johann Danner</span></div>
        </div>
        <div class="zeile ein" style="--d:1.8s;font-size:20px">Danke für die Aufmerksamkeit.</div>
      </div></div>` },
  ];

  // ------------------------------------------------------------------ Aufbau
  const buehne = document.getElementById('buehne'), rahmen = document.getElementById('rahmen');
  const GESAMT = SZENEN.reduce((s, z) => s + z.dauer, 0);
  const minuten = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let start = 0; SZENEN.forEach(z => { z.beginn = start; start += z.dauer; });

  SZENEN.forEach((z, i) => {
    const el = document.createElement('section');
    el.className = 'szene'; el.id = 'szene-' + z.id;
    el.setAttribute('aria-label', z.name);
    el.innerHTML = z.html() + (i > 0 && i < SZENEN.length - 1 ? `<div class="programmzeile"><span class="marke"><img src="img/logo.png" alt="">Musikverein Musterdorf · Beispiel</span><span><b>${String(i).padStart(2, '0')}</b> &nbsp;${esc(z.name)}</span></div>` : '');
    buehne.appendChild(el); z.el = el;
  });

  const fortschritt = document.getElementById('fortschritt'), programm = document.getElementById('programm');
  SZENEN.forEach((z, i) => {
    const b = document.createElement('button');
    b.style.setProperty('--w', z.dauer); b.title = `${i}. ${z.name}`; b.setAttribute('aria-label', `Kapitel ${i}: ${z.name}`);
    b.innerHTML = '<span></span>'; b.onclick = () => gehe(i, true); fortschritt.appendChild(b); z.balken = b;
    const p = document.createElement('button');
    p.innerHTML = `<b>${i === 0 ? '♪' : i}</b>${esc(z.name)}<em>${minuten(z.beginn)}</em>`; p.onclick = () => gehe(i, true); programm.appendChild(p); z.eintrag = p;
  });

  function skalieren() {
    const k = rahmen.clientWidth / 1600;
    buehne.style.transform = `scale(${k})`;
  }
  new ResizeObserver(skalieren).observe(rahmen); skalieren();

  // ------------------------------------------------------------------ Kamera
  function kameraSetzen(z, rect, text, wo) {
    const ansicht = z.el.querySelector('.ansicht'); if (!ansicht) return;
    const kam = ansicht.querySelector('.kamera'), mark = ansicht.querySelector('.markierung'), hin = ansicht.querySelector('.hinweis');
    if (!rect) { kam.style.transform = 'none'; kam.style.setProperty('--s', 1); mark.classList.remove('an'); hin.classList.remove('an'); return; }
    let [x, y, w, h] = rect; h = Math.min(h, 100 - y);
    const rand = 3, px = Math.max(0, x - rand), py = Math.max(0, y - rand), pw = Math.min(100 - px, w + 2 * rand), ph = Math.min(100 - py, h + 2 * rand);
    const s = Math.max(1, Math.min(2.4, 100 / pw, 100 / ph));
    const cx = px + pw / 2, cy = py + ph / 2;
    let tx = 50 - s * cx, ty = 50 - s * cy;
    tx = Math.min(0, Math.max(100 - 100 * s, tx)); ty = Math.min(0, Math.max(100 - 100 * s, ty));
    kam.style.setProperty('--s', s);
    kam.style.transform = `translate(${tx}%, ${ty}%) scale(${s})`;
    Object.assign(mark.style, { left: x + '%', top: y + '%', width: w + '%', height: h + '%' });
    mark.classList.add('an');
    hin.classList.remove('an');
    if (text) {
      // Position des Hinweises auf dem Bildschirm (nach Zoom)
      const sx = tx + s * x, sy = ty + s * y, sw = s * w, sh = s * h;
      hin.textContent = text;
      const st = hin.style; st.left = st.top = st.right = st.bottom = 'auto';
      // sichtbarer Bereich der Markierung im Fenster (Prozent), Hinweis ca. 40 % breit und 15 % hoch
      const bx = Math.max(0, sx), by = Math.max(0, sy), bx2 = Math.min(100, sx + sw), by2 = Math.min(100, sy + sh);
      const HB = 40, HH = 15, platz = { unten: 100 - by2 >= HH + 3, oben: by >= HH + 3, rechts: 100 - bx2 >= HB + 3, links: bx >= HB + 3 };
      const ziel = [wo, 'unten', 'oben', 'rechts', 'links'].find(w => platz[w]) || 'innen';
      const linksBei = Math.min(Math.max(bx, 2), 100 - HB - 2) + '%';
      if (ziel === 'unten') { st.left = linksBei; st.top = (by2 + 2.5) + '%'; }
      else if (ziel === 'oben') { st.left = linksBei; st.bottom = (100 - by + 2.5) + '%'; }
      else if (ziel === 'rechts') { st.left = (bx2 + 2) + '%'; st.top = Math.min(Math.max(by, 3), 100 - HH - 3) + '%'; }
      else if (ziel === 'links') { st.right = (100 - bx + 2) + '%'; st.top = Math.min(Math.max(by, 3), 100 - HH - 3) + '%'; }
      else { st.left = '3%'; st.bottom = '4%'; }
      spaeter(900, () => hin.classList.add('an'));
    }
  }
  function bildWechseln(z, name, adresse) {
    const ansicht = z.el.querySelector('.ansicht'); if (!ansicht) return;
    const kam = ansicht.querySelector('.kamera'), alt = kam.querySelector('img');
    const neu = document.createElement('img'); neu.src = `img/${name}.webp`; neu.alt = ''; neu.className = 'weg';
    alt.after(neu); void neu.offsetWidth; getComputedStyle(neu).opacity;
    spaeter(30, () => { neu.classList.remove('weg'); alt.classList.add('weg'); });
    spaeter(1000, () => alt.remove());
    const adr = z.el.querySelector('.adresse'); if (adr) adr.textContent = 'mv-musterdorf.at/syncopa/' + adresse;
  }
  function schrittAusfuehren(z, s) {
    const [, art, a, b, c] = s;
    if (art === 'fokus') kameraSetzen(z, a, b, c);
    else if (art === 'ganz') kameraSetzen(z, null);
    else if (art === 'bild') bildWechseln(z, a, b);
    else if (art === 'klasse') z.el.querySelector(a).classList.add(b);
    else if (art === 'handy') {
      const d = document.createElement('div'); d.innerHTML = handy('handy_ausrueckung', 1250, 250, 0, 230, 4); const h = d.firstElementChild;
      z.el.appendChild(h);
    }
  }

  // ------------------------------------------------------------------ Ablauf
  let aktuell = -1, uhr = 0, laeuft = false, tempo = 1, zuletzt = 0, erledigt = 0;
  function szeneAufbauen(i) {
    const z = SZENEN[i];
    // frisch aufbauen, damit Animationen und Kamera von vorne beginnen
    z.el.innerHTML = z.html() + (z.el.querySelector('.programmzeile')?.outerHTML || '');
    const startKnopf = z.el.querySelector('[data-start]'); if (startKnopf) startKnopf.onclick = () => abspielen(true);
  }
  function gehe(i, vonHand) {
    if (vonHand) buehne.classList.remove('ruhe');
    i = Math.max(0, Math.min(SZENEN.length - 1, i));
    if (aktuell >= 0) SZENEN[aktuell].el.classList.remove('aktiv');
    aktuell = i; uhr = 0; erledigt = 0;
    szeneAufbauen(i);
    void SZENEN[i].el.offsetWidth;
    SZENEN[i].el.classList.add('aktiv');
    SZENEN.forEach((z, n) => { z.balken.style.setProperty('--f', n < i ? '100%' : '0%'); z.eintrag.classList.toggle('jetzt', n === i); });
    document.getElementById('kapitelName').innerHTML = `<b>${i === 0 ? '♪' : String(i).padStart(2, '0')}</b>${esc(SZENEN[i].name)}`;
    if (vonHand && !AUFNAHME) { try { history.replaceState(null, '', '#' + SZENEN[i].id); } catch (e) {} }
    animationenTempo();
    anzeigen();
  }
  function animationenTempo() {
    if (!document.getAnimations) return;
    document.getAnimations().forEach(a => { a.playbackRate = tempo; });
  }
  function pausieren(still) {
    if (!document.getAnimations) return;
    document.getAnimations().forEach(a => still ? a.pause() : a.play());
  }
  function abspielen(an) {
    buehne.classList.remove('ruhe');
    laeuft = an;
    document.getElementById('spielSymbol').innerHTML = an ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
    document.getElementById('spielen').setAttribute('aria-label', an ? 'Pause' : 'Abspielen');
    if (an && aktuell === 0 && uhr < 10) uhr = SZENEN[0].dauer - 2600; // Titel kurz stehen lassen
    pausieren(!an); animationenTempo(); zuletzt = performance.now();
  }
  function anzeigen() {
    const z = SZENEN[aktuell];
    z.balken.style.setProperty('--f', Math.min(100, uhr / z.dauer * 100) + '%');
    document.getElementById('zeit').textContent = `${minuten(z.beginn + uhr)} / ${minuten(GESAMT)}`;
  }
  function takt(jetzt) {
    const dt = jetzt - zuletzt; zuletzt = jetzt;
    if (!AUFNAHME) tick(dt);
    requestAnimationFrame(takt);
  }
  function tick(dt) {
    if (laeuft) {
      uhr += dt * tempo;
      const z = SZENEN[aktuell], schritte = z.schritte || [];
      while (erledigt < schritte.length && schritte[erledigt][0] <= uhr) { schrittAusfuehren(z, schritte[erledigt]); erledigt++; animationenTempo(); }
      if (uhr >= z.dauer) {
        if (aktuell < SZENEN.length - 1) gehe(aktuell + 1);
        else { laeuft = false; abspielen(false); window.__FERTIG = true; }
      }
      anzeigen();
    }
  }
  // Ein Einzelbild weiter (nur Aufnahme): Uhr, Warteschlange und alle CSS-Animationen exakt setzen
  window.__bild = (dt) => {
    aufnahmeZeit += dt;
    for (let i = 0; i < warteschlange.length; i++) if (warteschlange[i].zeit <= aufnahmeZeit) { warteschlange.splice(i, 1)[0].fn(); i--; }
    tick(dt);
    document.getAnimations().forEach(a => {
      if (a.__start === undefined) a.__start = aufnahmeZeit - dt;
      a.pause(); a.currentTime = Math.max(0, aufnahmeZeit - a.__start);
    });
  };

  document.getElementById('spielen').onclick = () => abspielen(!laeuft);
  document.getElementById('weiter').onclick = () => gehe(aktuell + 1, true);
  document.getElementById('zurueck').onclick = () => gehe(uhr > 2500 ? aktuell : aktuell - 1, true);
  document.getElementById('tempo').onchange = e => { tempo = parseFloat(e.target.value) || 1; animationenTempo(); };
  document.getElementById('vollbild').onclick = () => {
    const ziel = document.querySelector('.seite');
    try { (document.fullscreenElement ? document.exitFullscreen() : ziel.requestFullscreen())?.catch?.(() => {}); } catch (e) {}
  };
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('select')) return;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); abspielen(!laeuft); }
    else if (e.key === 'ArrowRight') gehe(aktuell + 1, true);
    else if (e.key === 'ArrowLeft') gehe(aktuell - 1, true);
    else if (e.key === 'f') document.getElementById('vollbild').click();
  });

  const anker = (location.hash || '').slice(1);
  const startBei = Math.max(0, SZENEN.findIndex(z => z.id === anker));
  fetch('Syncopa-Vorstellung.webm', { method: 'HEAD' }).then(r => { if (r.ok) document.getElementById('videoLink').hidden = false; }).catch(() => {});
  if (!AUFNAHME && startBei === 0) buehne.classList.add('ruhe');
  gehe(startBei);
  if (!BEWEGUNG) document.getElementById('tempo').value = '1';
  // Aufnahme: Start erst auf Zeichen des Aufnahmeprogramms (nach dem Laden von Schriften und Bildern)
  window.__los = () => { tempo = 1; abspielen(true); uhr = 0; zuletzt = performance.now(); gehe(0); };
  zuletzt = performance.now(); requestAnimationFrame(takt);
})();
</script>
